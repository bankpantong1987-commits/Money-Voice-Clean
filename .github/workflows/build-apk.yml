name: Build Money Voice APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: Repair Android folder
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          rm -rf android
          flutter create --project-name money_voice --org com.moneyvoice.app --platforms android .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          sed -i '/repositoriesMode/d' android/settings.gradle
          sed -i 's/compileSdk.*/compileSdk = 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/1.9.22/2.2.0/g' android/settings.gradle
          sed -i 's/1.9.22/2.2.0/g' android/build.gradle
          flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: money-voice-apk
          path: build/app/outputs/flutter-apk/app-release.apk

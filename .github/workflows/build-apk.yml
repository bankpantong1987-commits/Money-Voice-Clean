name: Build Money Voice APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: Repair Android folder
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          rm -rf android
          flutter create --project-name money_voice --org com.moneyvoice.app --platforms android .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          sed -i 's/compileSdk.*/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/compileSdk.*/compileSdk = 36/' android/app/build.gradle || true
          sed -i 's/minSdk.*/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle || true
          sed -i 's/minSdkVersion = 21/minSdkVersion = 24/g' android/app/build.gradle.kts || true
          sed -i 's/2.1.0/2.2.0/g' android/settings.gradle.kts || true
          sed -i 's/2.1.0/2.2.0/g' android/settings.gradle || true
          sed -i 's/1.9.22/2.2.0/g' android/settings.gradle.kts || true
          sed -i 's/1.9.22/2.2.0/g' android/build.gradle.kts || true
          flutter pub get
          PUB_FILE=$(find ~/.pub-cache -path "*notification_listener_service-*/android/build.gradle" | head -1)
          if [ -n "$PUB_FILE" ]; then sed -i 's/^android {/android {\n    namespace = "com.notification_listener_service"/' "$PUB_FILE" || true; fi
          MANIFEST_FILE=$(find ~/.pub-cache -path "*notification_listener_service-*/android/src/main/AndroidManifest.xml" | head -1)
          if [ -n "$MANIFEST_FILE" ]; then sed -i 's/ package="[^"]*"//g' "$MANIFEST_FILE" || true; fi
          mkdir -p android/app/src/main/kotlin/com/moneyvoice/app
          cat > android/app/src/main/kotlin/com/moneyvoice/app/MyListener.kt <<'ENDOFFILE'
          package com.moneyvoice.app
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.speech.tts.TextToSpeech
          import java.util.Locale
          class MyListener : NotificationListenerService() {
            private var tts: TextToSpeech? = null
            override fun onCreate() {
              super.onCreate()
              tts = TextToSpeech(applicationContext) { status ->
                if (status == TextToSpeech.SUCCESS) {
                  tts?.language = Locale("th", "TH")
                }
              }
            }
            override fun onNotificationPosted(sbn: StatusBarNotification?) {
              super.onNotificationPosted(sbn)
              val extras = sbn?.notification?.extras
              if (extras == null) return
              val title = extras.getCharSequence("android.title")?.toString() ?: ""
              val text = extras.getCharSequence("android.text")?.toString() ?: ""
              val bigText = extras.getCharSequence("android.bigText")?.toString() ?: ""
              val all = title + " " + text + " " + bigText
              var word = "เงินเข้า"
              if (all.contains("เงินออก")) {
                word = "เงินออก"
              }
              val idx = all.indexOf("จำนวน")
              var after = all
              if (idx >= 0) {
                after = all.substring(idx + 6)
              }
              var current = ""
              var amount = ""
              for (ch in after) {
                if (ch.isDigit() || ch == ',' || ch == '.') {
                  current = current + ch
                } else {
                  if (current.length >= 1) {
                    break
                  }
                }
              }
              amount = current.replace(",", "")
              if (amount.endsWith(".00")) {
                amount = amount.substring(0, amount.length - 3)
              }
              if (amount.isNotEmpty()) {
                val msg = word + " " + amount + " บาท"
                tts?.speak(msg, TextToSpeech.QUEUE_FLUSH, null, "moneyvoice")
              }
            }
            override fun onDestroy() {
              tts?.shutdown()
              super.onDestroy()
            }
          }
          ENDOFFILE
          python3 -c "
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text()
          if 'MyListener' not in t:
              t = t.replace('</application>', '<service android:name=\".MyListener\" android:permission=\"android.permission.BIND_NOTIFICATION_LISTENER_SERVICE\" android:exported=\"true\"><intent-filter><action android:name=\"android.service.notification.NotificationListenerService\" /></intent-filter></service></application>')
              p.write_text(t)
          print('Manifest patched')
          "
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: money-voice-apk
          path: build/app/outputs/flutter-apk/app-release.apk
